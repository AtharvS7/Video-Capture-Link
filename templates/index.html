<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emotion Detector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg1: #12121c;
      --bg2: #1b1b2e;
      --card: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.09);
      --accent: #a6e3a1;
      --text: #e6e6ef;
      --muted: #8a8aa0;
    }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(1200px 700px at 20% 0%, var(--bg2), var(--bg1));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 18px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: 0.2px; }
    header .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #f38ba8; box-shadow: 0 0 10px #f38ba8;
    }
    header .dot.live { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
    header small { color: var(--muted); margin-left: auto; }

    main {
      flex: 1;
      display: flex;
      gap: 24px;
      padding: 24px;
      align-items: stretch;
    }
    .video-card {
      flex: 2;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      border: 1px solid var(--border);
      min-height: 320px;
      display: flex;
    }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

    .panel {
      flex: 1;
      min-width: 280px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      display: flex;
      flex-direction: column;
    }
    .now { text-align: center; margin-bottom: 22px; }
    .emoji { font-size: 4.5rem; line-height: 1; }
    #emotion {
      font-size: 2rem; font-weight: 700; text-transform: capitalize;
      margin-top: 8px; color: var(--accent); min-height: 2.4rem;
    }
    #confidence { color: var(--muted); font-size: 0.9rem; }

    .bars { margin-top: auto; }
    .bar-row { margin: 10px 0; }
    .bar-label {
      display: flex; justify-content: space-between;
      font-size: 0.82rem; color: var(--muted); margin-bottom: 4px;
      text-transform: capitalize;
    }
    .bar-track { height: 9px; background: rgba(255,255,255,0.06); border-radius: 6px; overflow: hidden; }
    .bar-fill {
      height: 100%; width: 0; border-radius: 6px;
      background: linear-gradient(90deg, #89b4fa, #a6e3a1);
      transition: width 0.35s ease;
    }
    footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 12px; }

    @media (max-width: 820px) {
      main { flex-direction: column; }
      .video-card { min-height: 46vh; }
    }
  </style>
</head>
<body>
  <header>
    <span class="dot" id="statusDot"></span>
    <h1>Emotion Detector</h1>
    <small id="statusText">connecting…</small>
  </header>

  <main>
    <div class="video-card">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>

    <div class="panel">
      <div class="now">
        <div class="emoji" id="emoji">🎭</div>
        <div id="emotion">—</div>
        <div id="confidence">waiting for a face…</div>
      </div>
      <div class="bars" id="bars"></div>
    </div>
  </main>

  <footer>Runs locally · frames analyzed by DeepFace on the Python backend</footer>

  <canvas id="capture" width="480" height="360" style="display:none"></canvas>

  <script>
    const EMOJI = {
      happy: "😄", sad: "😢", angry: "😠", surprise: "😲",
      fear: "😨", disgust: "🤢", neutral: "😐",
    };
    const EMOTIONS = Object.keys(EMOJI);

    const video = document.getElementById("video");
    const capture = document.getElementById("capture");
    const cctx = capture.getContext("2d");
    const overlay = document.getElementById("overlay");
    const octx = overlay.getContext("2d");
    const emojiEl = document.getElementById("emoji");
    const emotionEl = document.getElementById("emotion");
    const confEl = document.getElementById("confidence");
    const barsEl = document.getElementById("bars");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");

    // pre-build the bar rows once, then just update widths
    const fills = {};
    const values = {};
    for (const name of EMOTIONS) {
      const row = document.createElement("div");
      row.className = "bar-row";
      row.innerHTML = `
        <div class="bar-label"><span>${name}</span><span data-v>0%</span></div>
        <div class="bar-track"><div class="bar-fill"></div></div>`;
      barsEl.appendChild(row);
      fills[name] = row.querySelector(".bar-fill");
      values[name] = row.querySelector("[data-v]");
    }

    const history = []; // last few score maps, for smoothing
    const SMOOTH = 4;

    async function start() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480 },
        });
        video.srcObject = stream;
        statusDot.classList.add("live");
        statusText.textContent = "camera live";
        setInterval(sendFrame, 700);
      } catch (err) {
        statusText.textContent = "camera blocked";
        confEl.textContent = "please allow camera access and reload";
        console.error(err);
      }
    }

    let busy = false;
    async function sendFrame() {
      if (busy || video.readyState !== 4) return;
      busy = true;
      cctx.drawImage(video, 0, 0, capture.width, capture.height);
      const image = capture.toDataURL("image/jpeg", 0.85);
      try {
        const res = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image }),
        });
        handle(await res.json());
      } catch (err) {
        console.error(err);
      } finally {
        busy = false;
      }
    }

    function handle(data) {
      if (!data || !data.face) {
        history.length = 0;
        confEl.textContent = "no face detected";
        drawBox(null);
        return;
      }
      history.push(data.scores);
      if (history.length > SMOOTH) history.shift();

      const avg = {};
      for (const name of EMOTIONS) {
        avg[name] = history.reduce((s, h) => s + (h[name] || 0), 0) / history.length;
      }
      const [top, topVal] = Object.entries(avg).sort((a, b) => b[1] - a[1])[0];

      emojiEl.textContent = EMOJI[top] || "🎭";
      emotionEl.textContent = top;
      confEl.textContent = `${topVal.toFixed(0)}% confident`;
      for (const name of EMOTIONS) {
        fills[name].style.width = Math.max(avg[name], 1) + "%";
        values[name].textContent = avg[name].toFixed(0) + "%";
      }
      drawBox(data.box);
    }

    // draw the face rectangle, mirrored to match the flipped video
    function drawBox(box) {
      overlay.width = overlay.clientWidth;
      overlay.height = overlay.clientHeight;
      octx.clearRect(0, 0, overlay.width, overlay.height);
      if (!box) return;
      const W = overlay.width, H = overlay.height;
      const x = (1 - box.x - box.w) * W; // mirror X
      const y = box.y * H;
      octx.strokeStyle = "#a6e3a1";
      octx.lineWidth = 3;
      octx.strokeRect(x, y, box.w * W, box.h * H);
    }

    start();
  </script>
</body>
</html>
